<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw · PixelPane</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preload" href="/static/fonts/mona-sans-latin.0a047cf9.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<main>
  <header>
    <h1 class="brand"><a href="/" aria-label="PixelPane home">PixelPane</a></h1>
    <span class="pill" id="stat">connecting…</span>
    <div class="row">
      <nav class="row" aria-label="Pages"><a class="navlink" href="/" data-testid="home-link">Control</a><a class="navlink" href="/draw" data-testid="draw-link">Draw</a><a class="navlink" href="/animate" data-testid="animate-link">Animate</a><a class="navlink" href="/library" data-testid="library-link">GIFs</a><a class="navlink" href="/settings" data-testid="settings-link">Settings</a></nav>
    </div>
  </header>

  <section id="content" tabindex="-1" class="studio-draw">
    <h2 id="drawtitle">Draw</h2>
    <div class="tools" role="group" aria-label="Drawing tools">
      <div class="row" id="toolrow">
        <button data-tool="pen" data-testid="tool-pen" class="on" title="Pen (B)">Pen</button>
        <button data-tool="eraser" data-testid="tool-eraser" title="Eraser (E)">Eraser</button>
        <button data-tool="fill" data-testid="tool-fill" title="Fill (F)">Fill</button>
        <button data-tool="picker" data-testid="tool-picker" title="Pick a color (I)">Pick</button>
      </div>
      <div class="row">
        <label>Size <select id="size" aria-label="Brush size" data-testid="size"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></label>
        <label for="alpha">Opacity <span id="alphav">100%</span></label>
        <input type="range" id="alpha" min="10" max="100" step="10" value="100" style="width:110px" aria-label="Opacity" data-testid="opacity">
        <label><input type="checkbox" id="mirror" data-testid="mirror"> mirror</label>
        <label><input type="checkbox" id="grid" checked data-testid="grid"> grid</label>
      </div>
      <div class="row palette" id="palette" role="group" aria-label="Colors"></div>
      <div class="row"><input type="color" id="color" value="#ff004d" aria-label="Color" data-testid="draw-color">
        <button id="undo" data-testid="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 7h6a3 3 0 010 6H7M6.5 4L3.5 7l3 3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg></button>
        <button id="redo" data-testid="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M12 7H6a3 3 0 000 6h3M9.5 4l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg></button>
        <button id="clear" data-testid="draw-clear">Clear</button></div>
    </div>
    <div class="row examples" id="examples" hidden data-testid="examples"><span class="stat">Start from an example:</span></div>
    <div class="easel">
      <div class="canvaswrap grid" id="wrap"><canvas id="canvas" width="32" height="32" data-testid="draw-canvas" role="img" aria-label="Drawing canvas: draw with a mouse, pen or finger"></canvas></div>
      <div class="side">
        <div class="stat">On the board now</div>
        <div class="panel"><canvas id="preview" width="32" height="32" role="img" aria-label="live panel preview" data-testid="preview"></canvas></div>
        <label class="toggle"><input type="checkbox" id="live" checked data-testid="draw-live"> Live on the board</label>
        <div class="row"><button id="board" class="on" data-testid="board-toggle" title="Put it on the board, or take it off">Show on board</button></div>
        <div class="stat" id="livestat" role="status" data-testid="draw-status"></div>
      </div>
    </div>

    <div class="frames" id="framebox" hidden data-testid="frames">
      <h2>Frames</h2>
      <div class="strip" id="strip"></div>
      <div class="row">
        <button id="fprev" aria-label="Previous frame" title="Previous frame (←)" data-testid="frame-prev"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M11 3L5 8l6 5z" fill="currentColor"/></svg></button>
        <span class="stat" id="fpos" data-testid="frame-pos"></span>
        <button id="fnext" aria-label="Next frame" title="Next frame (→)" data-testid="frame-next"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3l6 5-6 5z" fill="currentColor"/></svg></button>
        <button id="fadd" title="New blank frame after this one (N)" data-testid="frame-add">+ New</button>
        <button id="fdup" title="Copy this frame (D)" data-testid="frame-dup">Duplicate</button>
        <button id="fdel" title="Delete this frame" data-testid="frame-del">Delete</button>
        <button id="fleft" title="Move this frame earlier (Shift+←)" data-testid="frame-earlier">Move earlier</button>
        <button id="fright" title="Move this frame later (Shift+→)" data-testid="frame-later">Move later</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="onion" checked data-testid="onion"> onion skin</label>
        <label for="fps">Speed <span id="fpsv"></span></label>
        <input type="range" id="fps" min="1" max="24" value="8" style="width:140px" aria-label="Frames per second" data-testid="fps">
        <button id="play" data-testid="anim-play" title="Play it here (space)">Play</button>
      </div>
    </div>

    <div class="row savebar">
      <input id="gname" placeholder="name" maxlength="40" aria-label="GIF name" data-testid="draw-name">
      <input id="gcat" placeholder="category (drawn)" maxlength="24" aria-label="Category" data-testid="draw-category">
      <button id="save" class="on" data-testid="draw-save">Save to GIF library</button>
    </div>
    <p class="stat" id="hint"></p>
  </section>

  <footer class="foot-bar" data-testid="footer">
    <a href="https://github.com/JoeKarlsson/pixelpane" target="_blank" rel="noopener" data-testid="github-link">PixelPane on GitHub</a>
    <span data-testid="maker">Made by <a href="https://www.joekarlsson.com" target="_blank" rel="noopener">Joe Karlsson</a></span>
    <span class="stat" id="footver"></span>
  </footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/common.js"></script>
<script src="/static/draw.js"></script>
</body>
</html>
