name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]   # 3.13 is what Raspberry Pi OS (Trixie) ships
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes pixelpane tests/*.py
      # Deprecations from our own code or tests fail the build, so the run stays clean.
      - run: python -W "error::DeprecationWarning:pixelpane" -W "error::DeprecationWarning:tests" -m unittest discover -s tests -t . -v
      - run: bash -n install.sh tools/deploy.sh tools/test.sh tools/ingest-gif.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e .
      - working-directory: tests/frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: tests/frontend
        run: npx playwright test
        env:
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/frontend/test-results
