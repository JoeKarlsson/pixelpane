name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]   # 3.13 is what Raspberry Pi OS (Trixie) ships
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pyflakes pixelpane tests/*.py
      # Deprecations from our own code or tests fail the build, so the run stays clean.
      - run: python -W "error::DeprecationWarning:pixelpane" -W "error::DeprecationWarning:tests" -m unittest discover -s tests -t . -v
      - run: bash -n install.sh tools/deploy.sh tools/test.sh tools/ingest-gif.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pip install -e .
      - working-directory: tests/frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: tests/frontend
        run: npx playwright test
        env:
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: tests/frontend/test-results
